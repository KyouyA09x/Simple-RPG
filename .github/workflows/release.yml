# Builds the Windows game on GitHub and publishes it as a Release. (The game lives in the simple-rpg folder of this repository.)
# Push a tag that starts with "v" (for example v0.1.0) or run it by hand from the Actions tab.
# The Release holds Stick-RPG-Setup-<version>.exe, the installer (no Node.js needed).
name: Build and release (Windows)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
defaults:
  run:
    working-directory: simple-rpg
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simple-rpg/package-lock.json
      - run: npm ci
      - run: node build/pack.js
      - run: node build/installer.js
      - uses: actions/upload-artifact@v4
        with:
          name: stick-rpg-windows
          path: |
            simple-rpg/build/_out/installer/Stick-RPG-Setup-*.exe
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            simple-rpg/build/_out/installer/Stick-RPG-Setup-*.exe
          name: Stick RPG ${{ github.ref_name }} (Windows)
          body: |
            **Run `Stick-RPG-Setup-*.exe`.** It installs for your user (no admin rights needed) and keeps your saves in `%APPDATA%\Stick RPG`, even if you uninstall.

            - Windows may show "Windows protected your PC" because the exe is not signed: click **More info**, then **Run anyway**.
            - AI "vibe coded": expect bugs and changing balance. Tested only on Windows 11.
            - Updating: run the newer installer over the old one; your saves stay.
            - What is new: see [CHANGELOG.md](https://github.com/KyouyA09x/Simple-RPG/blob/main/CHANGELOG.md).
